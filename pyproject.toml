[project]
name = "maps"
version = "0.1.0"
description = "MAPS: mapa de daño pulmonar en EPOC precoz a partir de TC, con ResNet preentrenada y biomarcadores cuantitativos"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "monai>=1.4",
    "lungmask>=0.2.20",
    "SimpleITK>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    "tifffile>=2024.8",
    "matplotlib>=3.9",
    "huggingface-hub>=0.25",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
