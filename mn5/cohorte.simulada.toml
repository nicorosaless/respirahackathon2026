# Configuración del ensayo con la cohorte simulada (scripts/simulate_cohort.py).
cohorte = "outputs/simulada"

[clinica]
tabla = "outputs/simulada/clinica.csv"
id = "ID"

[normativo]
referencia = "grupo == 'control'"
covariables = ["edad", "talla", "volumen_pulmon_ml"]
categoricas = ["sexo", "kernel"]

[evidencia]
objetivo = "dlco_pct"
objetivo_nombre = "DLCO, % del valor predicho"
tarea = "regression"
controles_negativos = ["sexo", "kernel", "fabricante"]
permutaciones = 100

[evidencia.bloques]
"clínica" = ["edad", "sexo", "paquetes_ano"]
"densitometría" = "tc:perc15,laa950,laa910"
"vasos y vía aérea" = "tc:agrupamiento,vasos_bv5_tbv,via_ramas_por_litro,via_disanapsia"
